
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Simple Website</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;
        }

        nav {
            background-color: #172554;
            color: white;
            padding: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }

        .hero {
            text-align: center;
            padding: 60px 20px;
            background-color: #dbeafe;
        }

        .hero h1 {
            color: #172554;
        }

        button {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 5px;
            cursor: pointer;
        }

        .cards {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 30px;
        }

        .card {
            background-color: white;
            padding: 25px;
            text-align: center;
            border-radius: 10px;
            width: 180px;
            box-shadow: 0 2px 8px #cccccc;
        }

        footer {
            background-color: #172554;
            color: white;
            text-align: center;
            padding: 15px;
        }

        @media (max-width: 600px) {
            .cards {
                flex-direction: column;
                align-items: center;
            }
        }
    </style>
</head>

<body>

    <nav>
        <h2>MyWebsite</h2>
        <div>
            <a href="#home">Home</a>
            <a href="#about">About</a>
            <a href="#contact">Contact</a>
        </div>
    </nav>

    <section class="hero" id="home">
        <h1>Welcome to My Website!</h1>
        <p>A simple and beautiful webpage using HTML and CSS.</p>
        <button onclick="alert('Welcome!')">Get Started</button>
    </section>

    <section class="cards" id="about">
        <div class="card">
            <h3>Learn</h3>
            <p>Learn new skills every day.</p>
        </div>

        <div class="card">
            <h3>Create</h3>
            <p>Build amazing projects.</p>
        </div>

        <div class="card">
            <h3>Grow</h3>
            <p>Improve your knowledge.</p>
        </div>
    </section>

    <footer id="contact">
        <p>&copy; 2026 MyWebsite. All rights reserved.</p>
    </footer>

</body>
</html>
